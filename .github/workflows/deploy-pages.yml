name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        # 커스텀 도메인(gyeotieum.hs-yang.com)은 루트 경로라 base 없이 빌드한다.
        run: npm run build
        env:
          # 홈서버(cloudflared 터널)로 공개된 백엔드. 끝의 /api까지 포함한다.
          VITE_API_BASE_URL: https://gyeotieum-api.hs-yang.com/api
          VITE_WELFARE_CENTER_PHONE: "129"
          VITE_WELFARE_CENTER_SMS_NUMBER: "129"

      - name: Add SPA fallback
        working-directory: frontend
        # Pages는 정적 서버라 /admin/cases/..., /helper/cases/... 새로고침이 404가 된다.
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
